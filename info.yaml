# Tiny Tapeout project information
project:
  title:        "JaneStreet Programmable Protocol Engine"      # Project title
  author:       "General-Purpose Protocol ASIC contributors"      # Your name
  discord:      "icdesignboi"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Four-thread programmable I/O engine emulating UART, SPI, I2C and more from writable firmware on generic bit/GPIO hardware primitives."      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_jonestreet_protocol_engine"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "jane_top.v"
    - "host_if.v"
    - "scheduler.v"
    - "thread.v"
    - "timing.v"
    - "gpio.v"
    - "edge_units.v"
    - "bit_engine.v"
    - "fifo.v"
    - "dm.v"
    - "prog_mem.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "HOST_MISO"
  ui[1]: "GPIO_P4"
  ui[2]: "GPIO_P5"
  ui[3]: "GPIO_P6"
  ui[4]: "GPIO_P7"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "STAT_HB"
  uo[1]: "STAT_ERR"
  uo[2]: "STAT_RUN"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "P0_UART_RX"
  uio[1]: "P1_UART_TX"
  uio[2]: "P2_I2C_SDA"
  uio[3]: "P3_I2C_SCL"
  uio[4]: "HOST_MOSI"
  uio[5]: "HOST_SCLK"
  uio[6]: "HOST_CS_N"
  uio[7]: "P7_FREE"

# Do not change!
yaml_version: 6
