# Tiny Tapeout project information
project:
  title:        "JaneStreet Programmable Protocol Engine"
  author:       "wlmoi"
  discord:      "icdesignboi"
  description:  "Four-thread programmable digital protocol engine"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_jonestreet_protocol_engine"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "defines.vh"
    - "jane_top.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "engine enable"
  ui[1]: "reserved control input"
  ui[2]: "reserved control input"
  ui[3]: "reserved control input"
  ui[4]: "thread start mask bit 0"
  ui[5]: "thread start mask bit 1"
  ui[6]: "thread start mask bit 2"
  ui[7]: "thread start mask bit 3"

  # Outputs
  uo[0]: "activity and output state bit 0"
  uo[1]: "activity and output state bit 1"
  uo[2]: "activity and output state bit 2"
  uo[3]: "activity and output state bit 3"
  uo[4]: "activity and output state bit 4"
  uo[5]: "activity and output state bit 5"
  uo[6]: "activity and output state bit 6"
  uo[7]: "activity and output state bit 7"

  # Bidirectional pins
  uio[0]: "GPIO input bit 0"
  uio[1]: "GPIO input bit 1"
  uio[2]: "GPIO input bit 2"
  uio[3]: "GPIO input bit 3"
  uio[4]: "GPIO input bit 4"
  uio[5]: "GPIO input bit 5"
  uio[6]: "GPIO input bit 6"
  uio[7]: "GPIO input bit 7"

# Do not change!
yaml_version: 6
